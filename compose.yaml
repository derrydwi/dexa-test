name: wfh-attendance
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_local_only
      TZ: UTC
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping --protocol=tcp -h 127.0.0.1 -proot_local_only --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  identity:
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/Dockerfile.api
      args:
        SERVICE: identity
    environment:
      TRUST_PROXY: "true"
      IDENTITY_DATABASE_URL: mysql://identity:identity_local@mysql:3306/identity_db
      APP_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/identity/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
  attendance:
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/Dockerfile.api
      args:
        SERVICE: attendance
    environment:
      ATTENDANCE_DATABASE_URL: mysql://attendance:attendance_local@mysql:3306/attendance_db
      IDENTITY_URL: http://identity:3001
      APP_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
      UPLOAD_DIR: /data/uploads
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - attendance-photos:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/api/attendance/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      identity:
        condition: service_healthy
      attendance:
        condition: service_healthy
volumes:
  mysql-data:
  attendance-photos:
