resolver 127.0.0.11 valid=5s ipv6=off;

upstream identity_backend {
  zone identity_backend 64k;
  server identity:3001 resolve;
}

upstream attendance_backend {
  zone attendance_backend 64k;
  server attendance:3002 resolve;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;
  # Only the private Docker proxy network may supply the client address.
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  location /api/attendance {
    proxy_pass http://attendance_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 15s;
  }
  location /api/ {
    proxy_pass http://identity_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 15s;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
